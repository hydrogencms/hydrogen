name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-24.04 rather than ubuntu-latest: the label moves to a newer release on GitHub's schedule.
jobs:
  # Fast gates: formatting of go.mod/go.sum, vet, lint, and the binary size, cold start and memory budgets.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          node: "false"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make tidy-check
      - run: make vet
      - run: make lint
      - name: Smoke and budgets
        run: make smoke

  # Go tests under the race detector against a real Postgres, in shards that run in parallel.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            modules: "."
          - name: modules
            modules: "modules/sqlite modules/postgres modules/wasmhooks modules/graphql"
          - name: tests
            modules: "tests"
          - name: examples
            modules: "examples/minimal examples/content examples/headless examples/multisite examples/starter examples/fullstack"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hydrogen
          POSTGRES_PASSWORD: hydrogen
          POSTGRES_DB: hydrogen
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U hydrogen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HYDROGEN_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          node: "false"
      - run: make test MODULES="${{ matrix.modules }}" TEST_TIMEOUT=25m

  # The npm packages (build, tests, gzip budgets), then the committed build outputs: they must match a rebuild.
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: make sdk
      - name: Admin app (typecheck, unit tests, size budgets) and admin/dist
        run: make admin-dist-check
      - run: make example-admin-check
      - run: make site-bridge-check

  # Admin end to end, one Playwright run per scenario (scripts/admin-e2e.sh ADMIN_E2E_ONLY).
  admin-e2e:
    name: admin-e2e (${{ matrix.only }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        only: [multisite, content, starter, next, fullstack]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          browser: "true"
      - run: make admin-e2e
        env:
          ADMIN_E2E_ONLY: ${{ matrix.only }}
      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-e2e-${{ matrix.only }}
          path: .work/e2e
          if-no-files-found: ignore
          retention-days: 7

  # Adapter conformance suite against every frontend, then the export, Next.js sample and WebAssembly hook scenarios.
  e2e:
    name: e2e (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: starter-next-e2e, browser: "true" }
          - { target: starter-sveltekit-e2e, browser: "true" }
          - { target: starter-nuxt-e2e, browser: "true" }
          - { target: starter-astro-e2e, browser: "true" }
          - { target: site-e2e, browser: "true" }
          - { target: site-proxy-e2e, browser: "true" }
          - { target: site-export-e2e, browser: "false" }
          - { target: next-e2e, browser: "false" }
          - { target: wasm-e2e, browser: "false" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          browser: ${{ matrix.browser }}
      - name: Cache the pinned Javy binary
        if: matrix.target == 'wasm-e2e'
        uses: actions/cache@v6
        with:
          path: .work/tools
          key: javy-${{ hashFiles('scripts/javy.sh') }}
      - run: make ${{ matrix.target }}

  # The documentation site, strict (broken links fail). Deploying is the docs workflow's job.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          node: "true"
      - run: make docs
