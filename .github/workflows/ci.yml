name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hydrogen
          POSTGRES_PASSWORD: hydrogen
          POSTGRES_DB: hydrogen
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U hydrogen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HYDROGEN_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Tidy
        run: make tidy-check
      - name: Vet
        run: make vet
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Smoke and budgets
        run: make smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/package-lock.json
            admin/ui/package-lock.json
      - name: Install npm dependencies and build the SDK packages
        run: |
          scripts/npm-ci.sh packages
          scripts/npm-ci.sh admin/ui
          cd packages && npm run build
      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('admin/ui/package-lock.json') }}
      - name: Install Chromium
        run: |
          cd admin/ui
          if [ "${{ steps.playwright.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Adapter conformance (Next.js starter and site module)
        run: make conformance
      - name: Admin end to end
        run: make admin-e2e
