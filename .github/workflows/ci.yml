name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hydrogen
          POSTGRES_PASSWORD: hydrogen
          POSTGRES_DB: hydrogen
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U hydrogen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HYDROGEN_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Tidy
        run: make tidy-check
      - name: Vet
        run: make vet
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Smoke and budgets
        run: make smoke
