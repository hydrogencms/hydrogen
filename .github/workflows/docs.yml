name: docs

# The site always builds (strict: broken links and missing pages fail). It deploys to GitHub Pages only when the
# repository variable DOCS_DEPLOY is "true" (Pages must be enabled with the source "GitHub Actions"; private
# repositories need a plan that supports it).
on:
  push:
    branches: [main]
    paths: ['docs/**', 'website/**', 'scripts/npm-ci.sh', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'website/**', 'scripts/npm-ci.sh', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_STRICT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: make docs
      - if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
