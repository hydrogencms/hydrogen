name: release

# Run by hand (gh workflow run release.yml -f version=v0.2.0 -f ref=<sha or branch>, see scripts/release.sh). The
# environment `release` can require a reviewer. The source commit must have a green ci-ok. The workflow builds the admin,
# records it in a release commit on the release branch, pushes that and the tags (a deploy key: the release branch
# ruleset lets it bypass, because the release commit has no checks of its own), then publishes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.2.0 (every version in the source must already be set to it)
        required: true
      ref:
        description: Source commit (sha, or a branch such as main or hotfix/v0.2.1)
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      checks: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve the source and check its CI
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "$VERSION is not a version like v0.2.0" >&2; exit 1; }
          sha=$(git rev-parse HEAD)
          echo "SOURCE=$sha" >> "$GITHUB_ENV"
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$n" -gt 0 ] || { echo "$sha has no successful ci-ok check: wait for CI on it" >&2; exit 1; }
      - uses: ./.github/actions/toolchain
      - name: Git identity and push access
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "secret RELEASE_DEPLOY_KEY is not set" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          key="$RUNNER_TEMP/release_key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
      - name: Release commit, tags and push
        run: scripts/release-commit.sh "$VERSION" "$SOURCE" --push

      - name: Build and archive the CLI from the release commit
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git checkout -q --detach "refs/tags/$TAG^{commit}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="hydrogen_${TAG}_${os}_${arch}"
            exe=hydrogen
            [ "$os" = windows ] && exe=hydrogen.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.buildVersion=$TAG" -o "build/$name/$exe" ./cmd/hydrogen
            cp LICENSE README.md CHANGELOG.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Release notes from the changelog
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Create the GitHub release
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag dist/* --title "Hydrogen $TAG" --notes-file notes.md "${prerelease[@]}"

  # Publishes the npm packages with provenance (each package is signed and linked to this workflow run and commit).
  # Off until the repository variable NPM_PUBLISH is "true". Authentication: npm trusted publishing (OIDC; configure
  # each package's trusted publisher on npmjs.com as hydrogencms/hydrogen, workflow release.yml, environment npm),
  # or the NPM_TOKEN secret (a granular token for the @hydrogencms scope) until trusted publishing is set up.
  # Provenance needs a public repository. The `npm` environment can require a reviewer before anything is published.
  npm:
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: Build and test the packages
        working-directory: packages
        run: |
          npm ci
          npm run build
          npm test
          npm run size
      - name: Check the tag matches the packages
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . scripts/npm-packages.sh
          for p in "${NPM_ORDER[@]}"; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "v$v" = "$TAG" ] || { echo "packages/$p is $v, the tag is $TAG" >&2; exit 1; }
          done
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/npm-publish.sh --provenance
