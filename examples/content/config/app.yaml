http:
  addr: ${env:LISTEN_ADDR:-:8080}

database:
  url: ${env:DATABASE_URL:-sqlite:.work/hydrogen.db}

content:
  schema_dir: ${env:SCHEMA_DIR:-schema}

manage:
  token: ${env:MANAGE_TOKEN:-dev-token}

modules:
  pages:
    sites: [main]
  images:
    presets:
      card: { width: 640, height: 360, fit: cover, widths: [320, 480] }
      hero: { width: 1600, widths: [640, 1024], format: jpeg, quality: 80 }

delivery:
  # Signs preview tokens: at least 32 characters; required outside dev (dev derives it from manage.token).
  preview_secret: ${env:PREVIEW_SECRET:-}

admin:
  # Custom elements built from ./admin (make example-admin); every kind of extension point is used once.
  elements: [./admin/dist/elements.js]
  theme: { name: Studio CMS, logo: ./admin/logo.svg, accent: "#7c3aed", css: ./admin/theme.css }
  strings: ./admin/strings.json
  widgets: { brand-color: x-brand-color }
  cells: { swatch: x-color-swatch }
  panels:
    - { tag: x-seo-panel, title: SEO, types: [article] }
    - { tag: x-alt-check, title: Alt text, types: [image] }
  previews: { hero: x-hero-preview }
  list_actions:
    - { tag: x-export-csv, title: Export CSV, types: [article], policy: content.read }
  actions:
    - { tag: x-translate-action, title: Send to translation, types: [article], policy: content.edit }
  dashboard:
    - { tag: x-recent-widget, title: Recently edited }
  views:
    - { path: /tools/import, tag: x-import-tool, menu: Tools, title: Import, policy: import.run }
  slots:
    - { tag: x-banner, at: editor.before }
    - { tag: x-assets-banner, at: assets.before }
