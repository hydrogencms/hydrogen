# One web channel serves every URL of the site. SITE_URL is the origin the site is published at (without the base path
# of a GitHub Pages project site: the site adds that itself, see site/astro.config.mjs).
languages:
  en: {}

channels:
  web:
    languages: [en]
    site: main
    frontend: "${env:SITE_URL:-http://127.0.0.1:4321}"
    match: { prefix: / }
