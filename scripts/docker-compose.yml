# Local Postgres for development and adapter tests: make db-up
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hydrogen
      POSTGRES_PASSWORD: hydrogen
      POSTGRES_DB: hydrogen
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrogen"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
